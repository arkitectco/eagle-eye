name: release

on:
  push:
    tags: ['v*.*.*']

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The tag must match the version an install reports, or the release says one thing and the plugin another.
      - name: Tag matches plugin.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p "require('./plugin/.claude-plugin/plugin.json').version")"
          if [ "v${version}" != "${TAG}" ]; then
            echo "::error::Tag ${TAG} does not match plugin.json version ${version}"
            exit 1
          fi

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=""
          case "${TAG}" in *-*) prerelease="--prerelease" ;; esac
          gh release create "${TAG}" --repo "${GITHUB_REPOSITORY}" --title "${TAG}" --generate-notes --verify-tag ${prerelease}
